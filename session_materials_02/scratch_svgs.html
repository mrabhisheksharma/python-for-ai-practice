
    <div class="side-graphic right">
        <svg viewBox="0 0 280 400" xmlns="http://www.w3.org/2000/svg">
            <style>
                .text { font-family: 'Inter', sans-serif; font-size: 14px; fill: var(--text-main); }
                .title { font-family: 'Inter', sans-serif; font-size: 16px; font-weight: bold; fill: var(--accent); }
                .box { fill: var(--bg-alt); stroke: var(--border); stroke-width: 2; rx: 6; }
                .line { stroke: var(--accent); stroke-width: 2; }
            </style>
            
            <!-- List -->
            <text x="10" y="30" class="title">1. List (Mutable)</text>
            <rect x="10" y="45" width="200" height="40" class="box" />
            <line x1="76" y1="45" x2="76" y2="85" class="line" stroke="var(--border)" />
            <line x1="142" y1="45" x2="142" y2="85" class="line" stroke="var(--border)" />
            <text x="35" y="70" class="text" text-anchor="middle">91.4</text>
            <text x="109" y="70" class="text" text-anchor="middle">85.2</text>
            <text x="175" y="70" class="text" text-anchor="middle">78.0</text>
            
            <!-- Tuple -->
            <text x="10" y="120" class="title">2. Tuple (Immutable)</text>
            <rect x="10" y="135" width="200" height="40" class="box" stroke-dasharray="4" />
            <line x1="110" y1="135" x2="110" y2="175" class="line" stroke="var(--border)" stroke-dasharray="4" />
            <text x="60" y="160" class="text" text-anchor="middle">28.7</text>
            <text x="160" y="160" class="text" text-anchor="middle">77.1</text>
            
            <!-- Dict -->
            <text x="10" y="210" class="title">3. Dictionary (Key-Value)</text>
            <rect x="10" y="225" width="80" height="30" class="box" />
            <text x="50" y="245" class="text" text-anchor="middle">"name"</text>
            <line x1="95" y1="240" x2="125" y2="240" class="line" marker-end="url(#arrow)" />
            <rect x="130" y="225" width="100" height="30" class="box" />
            <text x="180" y="245" class="text" text-anchor="middle">"Model-A"</text>

            <rect x="10" y="265" width="80" height="30" class="box" />
            <text x="50" y="285" class="text" text-anchor="middle">"accuracy"</text>
            <line x1="95" y1="280" x2="125" y2="280" class="line" marker-end="url(#arrow)" />
            <rect x="130" y="265" width="100" height="30" class="box" />
            <text x="180" y="285" class="text" text-anchor="middle">91.4</text>
            
            <!-- Set -->
            <text x="10" y="340" class="title">4. Set (Unique)</text>
            <circle cx="70" cy="370" r="25" fill="var(--accent)" fill-opacity="0.2" stroke="var(--accent)" stroke-width="2" />
            <circle cx="100" cy="370" r="25" fill="var(--accent-hover)" fill-opacity="0.2" stroke="var(--accent-hover)" stroke-width="2" />
            
            <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)" />
                </marker>
            </defs>
        </svg>
    </div>
    

    <div class="side-graphic left">
        <svg viewBox="0 0 280 400" xmlns="http://www.w3.org/2000/svg">
            <style>
                .text { font-family: 'Inter', sans-serif; font-size: 12px; fill: var(--text-main); }
                .title { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: bold; fill: #fff; }
                .class-box { fill: var(--bg-alt); stroke: var(--border); stroke-width: 2; rx: 6; }
                .class-header { fill: var(--accent); }
                .line { stroke: var(--accent); stroke-width: 2; fill: none; }
            </style>
            
            <!-- AIModel Base Class -->
            <rect x="40" y="20" width="200" height="100" class="class-box" />
            <path d="M 40 50 L 240 50" class="line" stroke="var(--border)" />
            <rect x="40" y="20" width="200" height="30" class="class-header" rx="6" />
            <path d="M 40 40 L 40 50 L 240 50 L 240 40 Z" class="class-header" />
            <text x="140" y="40" class="title" text-anchor="middle">AIModel (Base)</text>
            
            <text x="50" y="68" class="text">+ name</text>
            <text x="50" y="85" class="text">+ accuracy</text>
            <path d="M 40 95 L 240 95" class="line" stroke="var(--border)" />
            <text x="50" y="112" class="text">+ summary()</text>

            <!-- Inheritance Arrow -->
            <line x1="140" y1="120" x2="140" y2="180" class="line" marker-end="url(#triangle)" />
            
            <!-- AdvancedModel Subclass -->
            <rect x="40" y="190" width="200" height="100" class="class-box" />
            <path d="M 40 220 L 240 220" class="line" stroke="var(--border)" />
            <rect x="40" y="190" width="200" height="30" class="class-header" rx="6" />
            <path d="M 40 210 L 40 220 L 240 220 L 240 210 Z" class="class-header" />
            <text x="140" y="210" class="title" text-anchor="middle">AdvancedModel</text>
            
            <text x="50" y="238" class="text">+ version (new)</text>
            <path d="M 40 250 L 240 250" class="line" stroke="var(--border)" />
            <text x="50" y="268" class="text">+ summary() (overridden)</text>

            <defs>
                <marker id="triangle" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--bg-main)" stroke="var(--accent)" stroke-width="2" />
                </marker>
            </defs>
        </svg>
    </div>
    

    <div class="side-graphic right">
        <svg viewBox="0 0 280 300" xmlns="http://www.w3.org/2000/svg">
            <style>
                .text { font-family: 'Inter', sans-serif; font-size: 12px; fill: var(--text-main); }
                .commit { fill: var(--accent); stroke: var(--bg-main); stroke-width: 4; }
                .commit-alt { fill: var(--output-accent); stroke: var(--bg-main); stroke-width: 4; }
                .line { stroke: var(--accent); stroke-width: 4; fill: none; }
                .line-alt { stroke: var(--output-accent); stroke-width: 4; fill: none; stroke-dasharray: 4; }
                .branch-label { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: var(--text-muted); }
            </style>
            
            <text x="140" y="30" class="text" text-anchor="middle" font-weight="bold" fill="var(--accent)">Git Branching & Commits</text>
            
            <!-- Main branch line -->
            <line x1="80" y1="260" x2="80" y2="60" class="line" />
            <!-- Feature branch line -->
            <path d="M 80 200 C 160 170, 160 130, 160 100" class="line-alt" />
            <path d="M 160 100 C 160 80, 120 70, 80 60" class="line-alt" />

            <!-- Commits -->
            <circle cx="80" cy="260" r="10" class="commit" />
            <text x="100" y="264" class="text">Initial commit</text>

            <circle cx="80" cy="200" r="10" class="commit" />
            <text x="10" y="204" class="text" text-anchor="end">v1.0</text>

            <circle cx="160" cy="140" r="10" class="commit-alt" />
            <text x="180" y="144" class="text">Add features</text>

            <circle cx="80" cy="110" r="10" class="commit" />
            <text x="10" y="114" class="text" text-anchor="end">Hotfix</text>

            <circle cx="80" cy="60" r="10" class="commit" />
            <text x="10" y="64" class="text" text-anchor="end">Merge</text>
            
            <text x="70" y="290" class="branch-label" text-anchor="end">main</text>
            <text x="170" y="180" class="branch-label">feature</text>
        </svg>
    </div>
    

    <div class="side-graphic left">
        <svg viewBox="0 0 280 350" xmlns="http://www.w3.org/2000/svg">
            <style>
                .text { font-family: 'Inter', sans-serif; font-size: 13px; fill: var(--text-main); font-weight: 500; }
                .box { fill: var(--bg-alt); stroke: var(--border); stroke-width: 2; rx: 8; }
                .box-success { fill: rgba(16, 185, 129, 0.1); stroke: #10b981; stroke-width: 2; rx: 8; }
                .box-error { fill: rgba(239, 68, 68, 0.1); stroke: #ef4444; stroke-width: 2; rx: 8; }
                .line { stroke: var(--border); stroke-width: 2; fill: none; }
                .line-success { stroke: #10b981; stroke-width: 2; fill: none; }
                .line-error { stroke: #ef4444; stroke-width: 2; fill: none; stroke-dasharray: 4; }
                .label { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: var(--text-muted); }
            </style>

            <rect x="40" y="20" width="200" height="40" class="box" />
            <text x="140" y="45" class="text" text-anchor="middle">try: API Call</text>

            <!-- Success Path -->
            <path d="M 140 60 L 140 100 L 70 100 L 70 130" class="line-success" marker-end="url(#arrow-success)" />
            <rect x="20" y="130" width="100" height="40" class="box-success" />
            <text x="70" y="155" class="text" text-anchor="middle" fill="#10b981">Success</text>
            <text x="70" y="90" class="label" text-anchor="middle" fill="#10b981">200 OK</text>

            <!-- Error Path -->
            <path d="M 140 60 L 140 100 L 210 100 L 210 130" class="line-error" marker-end="url(#arrow-error)" />
            <rect x="160" y="130" width="100" height="40" class="box-error" />
            <text x="210" y="155" class="text" text-anchor="middle" fill="#ef4444">except:</text>
            <text x="210" y="90" class="label" text-anchor="middle" fill="#ef4444">Timeout/429</text>

            <!-- Finally -->
            <path d="M 70 170 L 70 200 L 140 200 L 140 220" class="line" />
            <path d="M 210 170 L 210 200 L 140 200 L 140 220" class="line" marker-end="url(#arrow-norm)" />
            <rect x="40" y="220" width="200" height="40" class="box" />
            <text x="140" y="245" class="text" text-anchor="middle">finally: Cleanup</text>

            <defs>
                <marker id="arrow-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981" />
                </marker>
                <marker id="arrow-error" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444" />
                </marker>
                <marker id="arrow-norm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--border)" />
                </marker>
            </defs>
        </svg>
    </div>
    

    <div class="side-graphic right">
        <svg viewBox="0 0 280 300" xmlns="http://www.w3.org/2000/svg">
            <style>
                .text { font-family: 'Inter', sans-serif; font-size: 13px; fill: var(--text-main); font-weight: 500; }
                .label { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: var(--accent); }
                .box { fill: var(--bg-alt); stroke: var(--border); stroke-width: 2; rx: 8; }
                .line { stroke: var(--accent); stroke-width: 2; fill: none; stroke-dasharray: 4; }
                .server { fill: var(--accent-glow); stroke: var(--accent); stroke-width: 2; rx: 8; }
            </style>

            <!-- Client -->
            <rect x="20" y="20" width="100" height="60" class="box" />
            <text x="70" y="45" class="text" text-anchor="middle">Your Code</text>
            <text x="70" y="65" class="label" text-anchor="middle">(Python)</text>

            <!-- Server -->
            <rect x="160" y="160" width="100" height="80" class="server" />
            <text x="210" y="195" class="text" text-anchor="middle">OpenAI</text>
            <text x="210" y="215" class="label" text-anchor="middle">API Server</text>

            <!-- Request Arrow -->
            <path d="M 70 80 L 70 120 L 160 120 L 160 170" class="line" marker-end="url(#arrow-api)" />
            <rect x="90" y="95" width="80" height="20" fill="var(--bg-main)" />
            <text x="130" y="110" class="label" text-anchor="middle">{"role":"user"}</text>

            <!-- Response Arrow -->
            <path d="M 160 220 L 130 220 L 130 60 L 120 60" class="line" marker-end="url(#arrow-api)" />
            <rect x="40" y="180" width="80" height="20" fill="var(--bg-main)" />
            <text x="80" y="193" class="label" text-anchor="middle">JSON Result</text>

            <defs>
                <marker id="arrow-api" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)" />
                </marker>
            </defs>
        </svg>
    </div>
